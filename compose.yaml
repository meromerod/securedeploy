services:
  api:
    build: .
    container_name: securedeploy-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://securedeploy:devpassword@db:5432/securedeploy
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    container_name: securedeploy-db
    environment:
      POSTGRES_USER: securedeploy
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: securedeploy
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securedeploy -d securedeploy"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
